# Application
spring.application.name=pp_backen
# The host injects PORT in production; 8083 stays the local default.
server.port=${PORT:8083}

# PostgreSQL — real values (Neon, in this project) come from DB_URL/DB_USERNAME/
# DB_PASSWORD in the environment (.env locally, dashboard env vars when deployed).
# Never hardcode real credentials here — this file is committed to git.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pp_backen_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT - override JWT_SECRET in any non-local environment
app.jwt.secret=${JWT_SECRET:VGhpcklzQVZlcnlTZWN1cmVKV1RTZWNyZXRLZXlGb3JQaGFybWFjeVF1aXpBcHBsaWNhdGlvbjIwMjY=}
app.jwt.expiration-ms=86400000

# Google Sign-In. Create an OAuth 2.0 Web client at https://console.cloud.google.com/apis/credentials
# with http://localhost:3000 as an authorised JavaScript origin, then paste the client id here
# (or set the GOOGLE_CLIENT_ID environment variable). Leave blank to disable the Google button.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Browsers allowed to call this API (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Seeded administrator account - change the password before deploying
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@pharmacyexam.lk}
app.admin.password=${ADMIN_PASSWORD:admin123}

# --- PDF paper import -------------------------------------------------------
# Vision extraction reads rasterised pages with the Claude API. Without a key the
# importer still runs in mock mode so the review flow can be exercised offline.
app.import.api-key=${VISION_API_KEY:${ANTHROPIC_API_KEY:}}
# auto | anthropic | gemini  — auto picks from the key prefix (sk-ant- = Anthropic)
app.import.provider=auto
# Blank uses the provider default: claude-sonnet-5 or gemini-2.5-flash
app.import.model=
app.import.dpi=200
# Pages per request.
#   1 = one page at a time. Half the payload, roughly half the time per call, and far
#       less likely to time out. A question split across a page break is still caught,
#       because the model flags it and the numbering check spots any gap.
#   2 = overlapping windows (1+2, 2+3 …) so a split question is seen whole by one call,
#       at the cost of much larger, slower requests.
app.import.window-pages=${VISION_WINDOW_PAGES:1}
app.import.max-pages=40
# Smallest gap between two model calls. Free tiers cap requests per minute, so pace
# them rather than getting rejected: 7000 ms is about 8 per minute, safely under the
# usual 10 RPM free-tier limit. Lower it if your quota is higher.
app.import.min-request-interval-ms=${VISION_MIN_INTERVAL_MS:7000}

# Where page renders and cropped figures are written
app.media.dir=${MEDIA_DIR:./media}

# Multipart limits for the PDF upload
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB
