# Free Render instances sleep after ~15 minutes without traffic, and waking one
# means booting the whole container - around two minutes, during which a phone
# browser has usually given up. This keeps the instance warm so students never
# meet that wait.
#
# Scheduled runs on GitHub are best-effort and are often delayed by 10+ minutes
# under load, so this fires every 5 minutes rather than every 10: even a badly
# delayed run should still land inside the 15 minute sleep window.
name: Keep the API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  # So it can be triggered by hand from the Actions tab to wake a cold instance.
  workflow_dispatch:

# A slow wake-up plus a delayed schedule could otherwise pile runs on top of
# each other; the queued one adds nothing the running one is not already doing.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the API
        run: |
          URL="https://pp-discuss-backend.onrender.com/api/auth/providers"

          # A cold start can take ~2 minutes, so allow a long first attempt
          # rather than reporting a false outage while the container boots.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 240 "$URL" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is awake."
              exit 0
            fi
            sleep 20
          done

          echo "::error::API did not return 200 after 3 attempts - it may genuinely be down."
          exit 1
